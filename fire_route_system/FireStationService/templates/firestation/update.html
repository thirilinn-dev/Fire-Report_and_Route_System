{% extends 'base.html' %}

{% block title %}Edit Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1rem auto;">
    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800; color: var(--cad-text); display: flex; align-items: center; gap: 0.5rem;">
                <svg class="cad-icon cad-icon-gold"><use href="#cad-icon-edit"/></svg>
                <span id="station-update-title">Edit Fire Station</span>
            </h1>
            <p id="station-update-subtitle" style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--cad-text-muted);">
                Update station parameters, contact details, or operational status.
            </p>
        </div>
        <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-update-back" style="font-size: 0.85rem;">
            ← Back to List
        </a>
    </div>

    <div class="cad-panel">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" id="lbl-upd-name">Station Name</label>
                <input type="text" id="name" name="name" value="{{ station.name }}" required class="cad-input">
            </div>

            <div class="form-group">
                <label for="address" id="lbl-upd-address">Address</label>
                <textarea id="address" name="address" required rows="3" class="cad-input">{{ station.address }}</textarea>
            </div>

            <div class="form-group">
                <label for="contact_number" id="lbl-upd-contact">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" value="{{ station.contact_number }}" required class="cad-input">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="latitude" id="lbl-upd-lat">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" value="{{ station.latitude }}" required class="cad-input">
                </div>

                <div class="form-group">
                    <label for="longitude" id="lbl-upd-lng">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" value="{{ station.longitude }}" required class="cad-input">
                </div>
            </div>

            <div class="form-group">
                <label for="status" id="lbl-upd-status">Status</label>
                <select id="status" name="status" required class="cad-select">
                    <option value="Active" {% if station.status == 'Active' %}selected{% endif %} id="opt-upd-active">အသင့်ရှိ</option>
                    <option value="Inactive" {% if station.status == 'Inactive' %}selected{% endif %} id="opt-upd-inactive">ယာယီပိတ်ထား</option>
                    <option value="Maintenance" {% if station.status == 'Maintenance' %}selected{% endif %} id="opt-upd-maintenance">ပြုပြင်ထိန်းသိမ်းဆဲ</option>
                </select>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--cad-border);">
                <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-update-cancel">Cancel</a>
                <button type="submit" class="cad-btn cad-btn-emergency" id="station-update-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    const translations = {
        en: {
            title: "Edit Fire Station",
            subtitle: "Update station parameters, contact details, or operational status.",
            back: "← Back to List",
            lblName: "Station Name", lblAddress: "Address", lblContact: "Contact Number",
            lblLat: "Latitude", lblLng: "Longitude", lblStatus: "Status",
            optActive: "Active", optInactive: "Inactive", optMaintenance: "Maintenance",
            save: "Save Changes", cancel: "Cancel"
        },
        my: {
            title: "မီးသတ်စခန်း အချက်အလက် ပြင်ဆင်ရန်",
            subtitle: "မီးသတ်စခန်း အချက်အလက်များ၊ ဆက်သွယ်ရန် ဖုန်းနှင့် တာဝန်ထမ်းဆောင်မှု အခြေအနေကို ပြင်ဆင်ပါ။",
            back: "← စခန်းများစာရင်းသို့",
            lblName: "မီးသတ်စခန်း အမည်", lblAddress: "တည်နေရာ လိပ်စာအပြည့်အစုံ", lblContact: "ဆက်သွယ်ရန် ဖုန်းနံပါတ်",
            lblLat: "လတ္တီတွဒ် (Latitude)", lblLng: "လောင်ဂျီတွဒ် (Longitude)", lblStatus: "တာဝန်ထမ်းဆောင်မှု အခြေအနေ",
            optActive: "တာဝန်ထမ်းဆောင်ဆဲ / အသင့်ရှိ (Active)", optInactive: "ယာယီပိတ်ထား (Inactive)", optMaintenance: "ပြုပြင်ထိန်းသိမ်းဆဲ (Maintenance)",
            save: "ပြောင်းလဲချက်များ သိမ်းဆည်းမည်", cancel: "မလုပ်တော့ပါ"
        }
    };

    function updateStationUpdateUI(lang) {
        const d = translations[lang];
        if (!d) return;
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        set("station-update-title", d.title);
        set("station-update-subtitle", d.subtitle);
        set("station-update-back", d.back);
        set("lbl-upd-name", d.lblName);
        set("lbl-upd-address", d.lblAddress);
        set("lbl-upd-contact", d.lblContact);
        set("lbl-upd-lat", d.lblLat);
        set("lbl-upd-lng", d.lblLng);
        set("lbl-upd-status", d.lblStatus);
        set("opt-upd-active", d.optActive);
        set("opt-upd-inactive", d.optInactive);
        set("opt-upd-maintenance", d.optMaintenance);
        set("station-update-save", d.save);
        set("station-update-cancel", d.cancel);
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateStationUpdateUI(localStorage.getItem("lang") || "my");
    });
    window.addEventListener("languageChanged", function(e) {
        updateStationUpdateUI(e.detail.lang);
    });
})();
</script>
{% endblock %}
