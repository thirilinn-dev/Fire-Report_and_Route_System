{% extends 'base.html' %}

{% block title %}Edit Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>Edit Fire Station</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Station Name</label>
                <input type="text" id="name" name="name" value="{{ station.name }}" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" required rows="3">{{ station.address }}</textarea>
            </div>

            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" value="{{ station.contact_number }}" required>
            </div>

            <div class="form-group">
                <label for="latitude">Latitude</label>
                <input type="number" id="latitude" name="latitude" step="any" value="{{ station.latitude }}" required>
            </div>

            <div class="form-group">
                <label for="longitude">Longitude</label>
                <input type="number" id="longitude" name="longitude" step="any" value="{{ station.longitude }}" required>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Active" {% if station.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if station.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    <option value="Maintenance" {% if station.status == 'Maintenance' %}selected{% endif %}>Maintenance</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: flex-end;">
                <button type="submit" class="btn btn-orange">Save Changes</button>
                <a href="{% url 'firestation_list' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
