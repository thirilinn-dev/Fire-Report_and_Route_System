{% extends 'base.html' %}

{% block title %}Edit Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 id="station-update-title">Edit Fire Station</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" id="lbl-upd-name">Station Name</label>
                <input type="text" id="name" name="name" value="{{ station.name }}" required>
            </div>

            <div class="form-group">
                <label for="address" id="lbl-upd-address">Address</label>
                <textarea id="address" name="address" required rows="3">{{ station.address }}</textarea>
            </div>

            <div class="form-group">
                <label for="contact_number" id="lbl-upd-contact">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" value="{{ station.contact_number }}" required>
            </div>

            <div class="form-group">
                <label for="latitude" id="lbl-upd-lat">Latitude</label>
                <input type="number" id="latitude" name="latitude" step="any" value="{{ station.latitude }}" required>
            </div>

            <div class="form-group">
                <label for="longitude" id="lbl-upd-lng">Longitude</label>
                <input type="number" id="longitude" name="longitude" step="any" value="{{ station.longitude }}" required>
            </div>

            <div class="form-group">
                <label for="status" id="lbl-upd-status">Status</label>
                <select id="status" name="status" required>
                    <option value="Active" {% if station.status == 'Active' %}selected{% endif %} id="opt-upd-active">Active</option>
                    <option value="Inactive" {% if station.status == 'Inactive' %}selected{% endif %} id="opt-upd-inactive">Inactive</option>
                    <option value="Maintenance" {% if station.status == 'Maintenance' %}selected{% endif %} id="opt-upd-maintenance">Maintenance</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: flex-end;">
                <button type="submit" class="btn btn-orange" id="station-update-save">Save Changes</button>
                <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-update-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    const translations = {
        en: {
            title: "Edit Fire Station",
            lblName: "Station Name", lblAddress: "Address", lblContact: "Contact Number",
            lblLat: "Latitude", lblLng: "Longitude", lblStatus: "Status",
            optActive: "Active", optInactive: "Inactive", optMaintenance: "Maintenance",
            save: "Save Changes", cancel: "Cancel"
        },
        my: {
            title: "မီးသတ်စခန်း တည်းဖြတ်မည်",
            lblName: "စခန်းအမည်", lblAddress: "လိပ်စာ", lblContact: "ဆက်သွယ်ရေးနံပါတ်",
            lblLat: "အလျားဒီဂရီ (Latitude)", lblLng: "အနံဒီဂရီ (Longitude)", lblStatus: "အခြေအနေ",
            optActive: "တက်ကြွ", optInactive: "ရပ်ဆိုင်းထား", optMaintenance: "ပြုပြင်ထိန်းသိမ်းမှု",
            save: "ပြောင်းလဲချက်များ သိမ်းဆည်းမည်", cancel: "မလုပ်တော့ပါ"
        }
    };

    function updateStationUpdateUI(lang) {
        const d = translations[lang];
        if (!d) return;
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        set("station-update-title", d.title);
        set("lbl-upd-name", d.lblName);
        set("lbl-upd-address", d.lblAddress);
        set("lbl-upd-contact", d.lblContact);
        set("lbl-upd-lat", d.lblLat);
        set("lbl-upd-lng", d.lblLng);
        set("lbl-upd-status", d.lblStatus);
        set("opt-upd-active", d.optActive);
        set("opt-upd-inactive", d.optInactive);
        set("opt-upd-maintenance", d.optMaintenance);
        set("station-update-save", d.save);
        set("station-update-cancel", d.cancel);
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateStationUpdateUI(localStorage.getItem("lang") || "my");
    });
    window.addEventListener("languageChanged", function(e) {
        updateStationUpdateUI(e.detail.lang);
    });
})();
</script>
{% endblock %}
