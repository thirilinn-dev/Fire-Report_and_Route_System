{% extends 'base.html' %}

{% block title %}Register Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 id="station-create-title">Register Fire Station</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" id="lbl-station-name">Station Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Central Fire Station">
            </div>

            <div class="form-group">
                <label for="address" id="lbl-station-address">Address</label>
                <textarea id="address" name="address" required placeholder="Full street address..." rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="contact_number" id="lbl-station-contact">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" required placeholder="e.g. 09-12345678">
            </div>

            <div class="form-group">
                <label for="latitude" id="lbl-station-lat">Latitude</label>
                <input type="number" id="latitude" name="latitude" step="any" required placeholder="e.g. 16.7842">
            </div>

            <div class="form-group">
                <label for="longitude" id="lbl-station-lng">Longitude</label>
                <input type="number" id="longitude" name="longitude" step="any" required placeholder="e.g. 96.1529">
            </div>

            <div class="form-group">
                <label for="status" id="lbl-station-status">Status</label>
                <select id="status" name="status" required>
                    <option value="Active" selected id="opt-station-active">Active</option>
                    <option value="Inactive" id="opt-station-inactive">Inactive</option>
                    <option value="Maintenance" id="opt-station-maintenance">Maintenance</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: flex-end;">
                <button type="submit" class="btn btn-orange" id="station-create-save">Register Station</button>
                <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-create-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    const translations = {
        en: {
            title: "Register Fire Station",
            lblName: "Station Name", lblAddress: "Address", lblContact: "Contact Number",
            lblLat: "Latitude", lblLng: "Longitude", lblStatus: "Status",
            optActive: "Active", optInactive: "Inactive", optMaintenance: "Maintenance",
            save: "Register Station", cancel: "Cancel"
        },
        my: {
            title: "မီးသတ်စခန်း မှတ်ပုံတင်မည်",
            lblName: "စခန်းအမည်", lblAddress: "လိပ်စာ", lblContact: "ဆက်သွယ်ရေးနံပါတ်",
            lblLat: "အလျားဒီဂရီ (Latitude)", lblLng: "အနံဒီဂရီ (Longitude)", lblStatus: "အခြေအနေ",
            optActive: "တက်ကြွ", optInactive: "ရပ်ဆိုင်းထား", optMaintenance: "ပြုပြင်ထိန်းသိမ်းမှု",
            save: "စခန်း မှတ်ပုံတင်မည်", cancel: "မလုပ်တော့ပါ"
        }
    };

    function updateStationCreateUI(lang) {
        const d = translations[lang];
        if (!d) return;
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        set("station-create-title", d.title);
        set("lbl-station-name", d.lblName);
        set("lbl-station-address", d.lblAddress);
        set("lbl-station-contact", d.lblContact);
        set("lbl-station-lat", d.lblLat);
        set("lbl-station-lng", d.lblLng);
        set("lbl-station-status", d.lblStatus);
        set("opt-station-active", d.optActive);
        set("opt-station-inactive", d.optInactive);
        set("opt-station-maintenance", d.optMaintenance);
        set("station-create-save", d.save);
        set("station-create-cancel", d.cancel);
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateStationCreateUI(localStorage.getItem("lang") || "my");
    });
    window.addEventListener("languageChanged", function(e) {
        updateStationCreateUI(e.detail.lang);
    });
})();
</script>
{% endblock %}
