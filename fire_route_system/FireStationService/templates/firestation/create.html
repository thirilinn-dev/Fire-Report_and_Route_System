{% extends 'base.html' %}

{% block title %}Register Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1rem auto;">
    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800; color: var(--cad-text); display: flex; align-items: center; gap: 0.5rem;">
                <svg class="cad-icon cad-icon-emergency"><use href="#cad-icon-station"/></svg>
                <span id="station-create-title">Register Fire Station</span>
            </h1>
            <p id="station-create-subtitle" style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--cad-text-muted);">
                Add a new active or reserve fire station to the dispatch grid.
            </p>
        </div>
        <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-create-back" style="font-size: 0.85rem;">
            ← Back to List
        </a>
    </div>

    <div class="cad-panel">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name" id="lbl-station-name">Station Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Central Fire Station" class="cad-input">
            </div>

            <div class="form-group">
                <label for="address" id="lbl-station-address">Address</label>
                <textarea id="address" name="address" required placeholder="Full street address..." rows="3" class="cad-input"></textarea>
            </div>

            <div class="form-group">
                <label for="contact_number" id="lbl-station-contact">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" required placeholder="e.g. 09-12345678" class="cad-input">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="latitude" id="lbl-station-lat">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" required placeholder="e.g. 21.9750" class="cad-input">
                </div>

                <div class="form-group">
                    <label for="longitude" id="lbl-station-lng">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" required placeholder="e.g. 96.0830" class="cad-input">
                </div>
            </div>

            <div class="form-group">
                <label for="status" id="lbl-station-status">Status</label>
                <select id="status" name="status" required class="cad-select">
                    <option value="Active" selected id="opt-station-active">အသင့်ရှိ</option>
                    <option value="Inactive" id="opt-station-inactive">ယာယီပိတ်ထား</option>
                    <option value="Maintenance" id="opt-station-maintenance">ပြုပြင်ထိန်းသိမ်းဆဲ</option>
                </select>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--cad-border);">
                <a href="{% url 'firestation_list' %}" class="btn btn-outline" id="station-create-cancel">Cancel</a>
                <button type="submit" class="cad-btn cad-btn-emergency" id="station-create-save">Register Station</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    const translations = {
        en: {
            title: "Register Fire Station",
            subtitle: "Add a new active or reserve fire station to the dispatch grid.",
            back: "← Back to List",
            lblName: "Station Name", lblAddress: "Address", lblContact: "Contact Number",
            lblLat: "Latitude", lblLng: "Longitude", lblStatus: "Status",
            optActive: "Active", optInactive: "Inactive", optMaintenance: "Maintenance",
            save: "Register Station", cancel: "Cancel"
        },
        my: {
            title: "မီးသတ်စခန်း အသစ်ထည့်သွင်းရန်",
            subtitle: "အရေးပေါ် စေလွှတ်မှုကွန်ရက်ထဲသို့ မီးသတ်စခန်း အသစ်တစ်ခု ထည့်သွင်းသတ်မှတ်ပါ။",
            back: "← စခန်းများစာရင်းသို့",
            lblName: "မီးသတ်စခန်း အမည်", lblAddress: "တည်နေရာ လိပ်စာအပြည့်အစုံ", lblContact: "ဆက်သွယ်ရန် ဖုန်းနံပါတ်",
            lblLat: "လတ္တီတွဒ် (Latitude)", lblLng: "လောင်ဂျီတွဒ် (Longitude)", lblStatus: "တာဝန်ထမ်းဆောင်မှု အခြေအနေ",
            optActive: "တာဝန်ထမ်းဆောင်ဆဲ / အသင့်ရှိ (Active)", optInactive: "ယာယီပိတ်ထား (Inactive)", optMaintenance: "ပြုပြင်ထိန်းသိမ်းဆဲ (Maintenance)",
            save: "မီးသတ်စခန်း သိမ်းဆည်းမည်", cancel: "မလုပ်တော့ပါ"
        }
    };

    function updateStationCreateUI(lang) {
        const d = translations[lang];
        if (!d) return;
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        set("station-create-title", d.title);
        set("station-create-subtitle", d.subtitle);
        set("station-create-back", d.back);
        set("lbl-station-name", d.lblName);
        set("lbl-station-address", d.lblAddress);
        set("lbl-station-contact", d.lblContact);
        set("lbl-station-lat", d.lblLat);
        set("lbl-station-lng", d.lblLng);
        set("lbl-station-status", d.lblStatus);
        set("opt-station-active", d.optActive);
        set("opt-station-inactive", d.optInactive);
        set("opt-station-maintenance", d.optMaintenance);
        set("station-create-save", d.save);
        set("station-create-cancel", d.cancel);
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateStationCreateUI(localStorage.getItem("lang") || "my");
    });
    window.addEventListener("languageChanged", function(e) {
        updateStationCreateUI(e.detail.lang);
    });
})();
</script>
{% endblock %}
