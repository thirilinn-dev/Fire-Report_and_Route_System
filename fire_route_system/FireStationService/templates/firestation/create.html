{% extends 'base.html' %}

{% block title %}Register Fire Station - Fire Route System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>Register Fire Station</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Station Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Central Fire Station">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" required placeholder="Full street address..." rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="contact_number">Contact Number</label>
                <input type="tel" id="contact_number" name="contact_number" required placeholder="e.g. 09-12345678">
            </div>

            <div class="form-group">
                <label for="latitude">Latitude</label>
                <input type="number" id="latitude" name="latitude" step="any" required placeholder="e.g. 16.7842">
            </div>

            <div class="form-group">
                <label for="longitude">Longitude</label>
                <input type="number" id="longitude" name="longitude" step="any" required placeholder="e.g. 96.1529">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Active" selected>Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <button type="submit" class="btn btn-orange">Register Station</button>
                <a href="{% url 'firestation_list' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
