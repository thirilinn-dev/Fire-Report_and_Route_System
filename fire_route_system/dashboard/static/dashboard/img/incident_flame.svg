<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="flameBg" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="70%" stop-color="#e61c00"/>
      <stop offset="100%" stop-color="#990000"/>
    </radialGradient>
    <linearGradient id="flameOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="flameYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ffdd00"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Red Flame Body -->
  <path d="M50 4 C50 4, 66 22, 66 38 C66 42, 64 45, 62 48 C68 40, 77 41, 79 49 C85 41, 91 48, 89 60 C87 75, 71 96, 50 96 C29 96, 13 75, 11 60 C9 48, 15 41, 21 49 C23 41, 32 40, 38 48 C36 45, 34 42, 34 38 C34 22, 50 4, 50 4 Z" 
        fill="url(#flameBg)" 
        stroke="#800000" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#flameGlow)"/>

  <!-- Middle Orange Flame Layer -->
  <path d="M50 18 C50 18, 62 33, 62 46 C62 52, 59 55, 56 57 C61 50, 68 52, 70 59 C74 53, 79 59, 78 68 C76 80, 65 91, 50 91 C35 91, 24 80, 22 68 C21 59, 26 53, 30 59 C32 52, 39 50, 44 57 C41 55, 38 52, 38 46 C38 33, 50 18, 50 18 Z" 
        fill="url(#flameOrange)"/>

  <!-- Inner Yellow Core -->
  <path d="M50 32 C50 32, 58 44, 58 56 C58 63, 54 66, 51 68 C55 62, 60 65, 61 70 C63 78, 57 85, 50 85 C43 85, 37 78, 39 70 C40 65, 45 62, 49 68 C46 66, 42 63, 42 56 C42 44, 50 32, 50 32 Z" 
        fill="url(#flameYellow)"/>

  <!-- Center Teardrop Flare -->
  <path d="M50 46 C50 46, 54 56, 54 64 C54 72, 46 72, 46 64 C46 56, 50 46, 50 46 Z" 
        fill="#ffffff" 
        opacity="0.85"/>
</svg>
